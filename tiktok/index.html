<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pip Insights: TikTok connected</title><link rel="stylesheet" href="../style.css"></head>
<body>
<h1>TikTok authorization</h1>
<p id="msg">No authorization code in this address.</p>
<p><button id="copy" hidden>Copy this page's address</button></p>
<p>Paste it into the terminal prompt from <code>python3 scripts/insights_auth.py tiktok-add &lt;handle&gt;</code> within 10 minutes. Nothing on this page is sent anywhere; the code stays in your browser.</p>
<script>
const q = new URLSearchParams(location.search);
if (q.get("auth_code") || q.get("code")) {
  document.getElementById("msg").textContent = "Authorized. Copy this page's full address and paste it into the terminal.";
  const b = document.getElementById("copy");
  b.hidden = false;
  b.onclick = () => navigator.clipboard.writeText(location.href).then(() => { b.textContent = "Copied"; });
} else if (q.get("error")) {
  document.getElementById("msg").textContent = "TikTok returned an error: " + q.get("error");
}
</script>
</body>
</html>
